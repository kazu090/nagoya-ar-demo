<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARマーカー印刷用 A4</title>
  <style>
    @page { size: A4; margin: 12mm; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #111; }
    .sheet { width: 186mm; min-height: 273mm; padding-top: 8mm; box-sizing: border-box; }
    h1 { font-size: 14pt; margin: 0 0 6mm; }
    p { font-size: 9pt; line-height: 1.6; margin: 0 0 6mm; }
    .row { display: flex; gap: 12mm; align-items: flex-start; margin-top: 8mm; }
    .marker-box { text-align: center; font-size: 8pt; }
    .marker10 { width: 10mm; height: 10mm; image-rendering: auto; }
    .marker15 { width: 15mm; height: 15mm; image-rendering: auto; }
    .marker25 { width: 25mm; height: 25mm; image-rendering: auto; }
    .frame { border: .2mm solid #ddd; padding: 4mm; display: inline-block; }
    .note { margin-top: 12mm; font-size: 8.5pt; color: #333; }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>名古屋城ハンコARマーカー 印刷用</h1>
    <p>まずは25mmで認識確認し、動いたら15mm、最後に10mmで試してください。印刷設定は「実際のサイズ」または「倍率100%」推奨です。</p>
    <div class="row">
      <div class="marker-box"><div class="frame"><img class="marker10" src="./assets/marker_nagoya_castle.png"></div><br>10mm</div>
      <div class="marker-box"><div class="frame"><img class="marker15" src="./assets/marker_nagoya_castle.png"></div><br>15mm</div>
      <div class="marker-box"><div class="frame"><img class="marker25" src="./assets/marker_nagoya_castle.png"></div><br>25mm テスト用</div>
    </div>
    <p class="note">注意：AR画像認識は、照明・カメラ距離・印刷のにじみ・紙の反射で安定性が変わります。10mmはかなり小さいため、デモ検証では大きめから試すのが安全です。</p>
  </div>
</body>
</html>
